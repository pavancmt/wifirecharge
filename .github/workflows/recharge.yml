name: Automated Portal Recharge
on:
  repository_dispatch:
    types: [recharge_trigger]

jobs:
  execute-recharge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Recharge Bot
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          TARGET_NUMBER: ${{ github.event.client_payload.phone_number }}
        run: python recharge.py
